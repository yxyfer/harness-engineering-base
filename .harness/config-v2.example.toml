# Review and merge deliberately; never automatically replace config.toml.
schema_version = 2

[project]
profiles = ["auto"]
frameworks = ["auto"]
capabilities = []
roots = ["."]

[commands]
setup = ""
start = ""
check = ""
test = ""
smoke = ""

[checks]
required = [
  "architecture", "documentation", "provenance", "demo-integrity", "standards",
]

[standards]
line_length = 80
file_lines_warning = 350
function_lines_warning = 50

[readiness]
required_documents = ["auto"]
fail_on_needs_input = true

[security]
# Explicitly no scanner assurance; local/ci fail as unsupported until Step 09.
# Relevant capability security context cannot be removed with this setting.
mode = "off"

[analysis]
exclude = [
  ".harness/tmp", ".git", ".venv", "node_modules", "dist", "build", "coverage",
  "__pycache__", "vendor", "vendors", "generated", "migrations", "schemas",
  "fixtures",
]
