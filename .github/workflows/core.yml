name: Harness core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      HARNESS_CI_LOGS: .harness/tmp/ci-logs
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.10.0'
      - name: Locked setup
        run: |
          set -euo pipefail
          test "$(npm --version)" = '11.6.0'
          mkdir -p "$HARNESS_CI_LOGS"
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: \
            -r .harness/ci/requirements.lock 2>&1 | tee "$HARNESS_CI_LOGS/python-setup.log"
          npm ci --ignore-scripts --prefix .harness/ci \
            2>&1 | tee "$HARNESS_CI_LOGS/node-tools-setup.log"
          npm ci --ignore-scripts --prefix .harness/tests/fixtures/nextjs-project \
            2>&1 | tee "$HARNESS_CI_LOGS/node-fixture-setup.log"
          npm ci --ignore-scripts --prefix .harness/templates/typescript \
            2>&1 | tee "$HARNESS_CI_LOGS/typescript-defaults-setup.log"
          for target in .harness/templates/python .harness/tests/fixtures/python-project; do
            python3 -m venv "$target/.venv"
            "$target/.venv/bin/python" -m pip install --require-hashes --only-binary=:all: \
              -r .harness/templates/python/requirements-dev.lock
          done
          sh .harness/ci/setup-shell.sh "$RUNNER_TEMP/harness-bin" \
            2>&1 | tee "$HARNESS_CI_LOGS/shell-setup.log"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "$PWD/.harness/ci/node_modules/.bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/harness-bin" >> "$GITHUB_PATH"
      - name: Native static checks and policy
        run: python3 .harness/ci/run.py static
      - name: Harness contract tests and self-tests
        run: python3 .harness/ci/run.py contracts
      - name: Existing fixture checks, tests and smoke
        run: python3 .harness/ci/run.py fixtures
      - name: Disposable negative controls
        run: python3 .harness/ci/run.py negatives
      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harness-core-logs
          path: .harness/tmp/ci-logs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
