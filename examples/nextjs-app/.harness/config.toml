schema_version = 2

[project]
profiles = ["typescript", "markdown"]
frameworks = ["nextjs"]
capabilities = ["browser-ui", "identity", "multi-tenancy", "persistence"]
roots = ["."]

[commands]
setup = "npm ci --ignore-scripts --no-audit --no-fund"
start = "npm run start"
check = "npm run check"
format = "npm run format"
test = "npm run test"
smoke = "npm run smoke"

[checks]
required = ["architecture", "documentation", "provenance", "demo-integrity", "standards"]

[standards]
line_length = 80
file_lines_warning = 350
function_lines_warning = 50

[readiness]
required_documents = ["PRODUCT.md", "ARCHITECTURE.md", "DESIGN.md", "DATA.md", "QUALITY.md", "SECURITY.md", "DECISIONS.md"]
fail_on_needs_input = true

[security]
mode = "local"

[analysis]
exclude = [".git", "node_modules", ".next", ".harness/reports", ".harness/tmp"]
