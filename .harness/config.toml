schema_version = 1

[project]
profiles = ["auto"]

[commands]
setup = ""
start = ""
check = ".venv/bin/python .harness/ci/run.py native"
format = ".venv/bin/python .harness/ci/run.py format"
test = "python3 .harness/bin/python-tests.py unittest .harness/tests"
smoke = ""

[checks]
required = [
  "architecture",
  "documentation",
  "provenance",
  "demo-integrity",
  "standards",
]

[standards]
line_length = 80
file_lines_warning = 350
function_lines_warning = 50

[readiness]
required_documents = [
  "PRODUCT.md",
  "ARCHITECTURE.md",
  "DESIGN.md",
  "DATA.md",
  "QUALITY.md",
  "SECURITY.md",
  "DECISIONS.md",
]
fail_on_needs_input = false

[security]
mode = "local"

[analysis]
exclude = [
  ".harness/tmp",
  ".git",
  ".venv",
  "node_modules",
  "dist",
  "build",
  "coverage",
  "__pycache__",
  "vendor",
  "vendors",
  "generated",
  "migrations",
  "schemas",
  "fixtures",
]
